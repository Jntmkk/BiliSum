name: Auto Merge Release PR

# Release PR（prepare-release.yml 创建，标题 "Release vX.Y.Z"）打开时启用 GitHub
# 原生 auto-merge：GitHub 在 PR 的必需检查（ci-gate）通过后自动 squash 合并。
#
# 首个步骤会幂等地完成两项一次性仓库配置：
# - 开启仓库的 Allow auto-merge
# - master 分支保护：要求 ci-gate 检查通过（不强制 review / 不强制分支最新）

on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: startsWith(github.event.pull_request.title, 'Release v')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure auto-merge and CI gate on master
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/${GH_REPO}" -X PATCH -f allow_auto_merge=true
          gh api "repos/${GH_REPO}/branches/master/protection" -X PUT --input - <<'JSON'
          {
            "required_status_checks": { "strict": false, "contexts": ["ci-gate"] },
            "enforce_admins": false,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          JSON

      - name: Enable auto-merge on the Release PR
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "${PR_NUMBER}" --auto --squash --delete-branch
