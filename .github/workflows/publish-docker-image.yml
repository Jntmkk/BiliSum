name: Publish Docker Image

# 触发方式：
# - push 到 master：自动构建并推送 edge 标签的镜像（不影响正式版本号镜像）
# - GitHub Release 发布：自动构建并推送该 release tag 的镜像（稳定版附带 latest）
# - 手动触发（workflow_dispatch）：构建并推送指定 release tag 的镜像，
#   release_tag 留空时使用最新的已发布 release tag。

on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (empty = latest release)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  # 推送到 ghcr.io 需要写入 packages(GITHUB_TOKEN 自带,不用额外配凭据)。
  # 国内服务器访问 Docker Hub 受限,改从 ghcr.io 拉镜像,所以这里要加推一份到 ghcr。
  packages: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            # master 推送：构建 edge 镜像，不解析 release tag，checkout 触发提交本身。
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid release tag: '${tag}'" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # full：完整镜像（含 knowledge extra → torch，~3.5GB）
        # mini：瘦身镜像（无 torch，知识库功能不可用，~0.6GB）
        variant: [full, mini]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ needs.resolve-tag.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies without package install scripts
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci --prefix apps/desktop --prefer-offline --no-audit --fund=false --ignore-scripts

      - name: Build web static assets
        run: npm run build:web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'bbmike253' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 国内服务器访问 Docker Hub 受限(加速器只代理官方库、daocloud 有白名单),
      # 所以同时推一份到 ghcr.io。GITHUB_TOKEN 自带凭据,无需额外配置,
      # 且 ghcr.io 国内可正常拉取(实测 ~97s 拉取完整镜像)。
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose Docker tags
        id: tags
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          PRERELEASE: ${{ needs.resolve-tag.outputs.prerelease }}
          VARIANT: ${{ matrix.variant }}
          HUB_REPOSITORY: bbmike253/bilisum
          # 推送到 GHCR 的仓库名。ghcr 要求全小写；${{ github.repository }} 是
          # "Jntmkk/Bilisum"（含大写），所以在 run 里用 tr 转小写拼成 ghcr.io/jntmkk/bilisum。
          GHCR_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          suffix=""
          if [ "${VARIANT}" = "mini" ]; then
            suffix="-mini"
          fi
          # ghcr 要求仓库名全小写（github.repository 是 "Jntmkk/BiliSum"）
          ghcr_repo="$(printf '%s' "${GHCR_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tags<<EOF"
            echo "${HUB_REPOSITORY}:${TAG}${suffix}"
            echo "${HUB_REPOSITORY}:${VERSION}${suffix}"
            # 国内服务器拉不到的 Docker Hub 时改从 ghcr.io 拉,所以同步推一份到 GHCR。
            echo "${ghcr_repo}:${TAG}${suffix}"
            echo "${ghcr_repo}:${VERSION}${suffix}"
            if [ "${PRERELEASE}" != "true" ]; then
              # 稳定版更新 latest；预发布不覆盖稳定版镜像。
              echo "${HUB_REPOSITORY}:latest${suffix}"
              echo "${ghcr_repo}:latest${suffix}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            KNOWLEDGE=${{ matrix.variant == 'full' && '1' || '0' }}
          cache-from: type=gha,scope=bilisum-docker-${{ matrix.variant }}
          cache-to: type=gha,mode=min,scope=bilisum-docker-${{ matrix.variant }}
          tags: ${{ steps.tags.outputs.tags }}
