name: Publish Docker Image

# 触发方式：
# - push 到 master：自动构建并推送 edge 标签的镜像（不影响正式版本号镜像）
# - GitHub Release 发布：自动构建并推送该 release tag 的镜像（稳定版附带 latest）
# - 手动触发（workflow_dispatch）：构建并推送指定 release tag 的镜像，
#   release_tag 留空时使用最新的已发布 release tag。

on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (empty = latest release)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Resolve release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "push" ]; then
            # master 推送：构建 edge 镜像，不解析 release tag，checkout 触发提交本身。
            echo "tag=edge" >> "$GITHUB_OUTPUT"
            echo "version=edge" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT_NAME}" = "release" ]; then
            tag="${RELEASE_TAG}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          fi
          if ! printf '%s' "${tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "Invalid release tag: '${tag}'" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "ref=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: resolve-tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ needs.resolve-tag.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies without package install scripts
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm ci --prefix apps/desktop --prefer-offline --no-audit --fund=false --ignore-scripts

      - name: Build web static assets
        run: npm run build:web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'bbmike253' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose Docker tags
        id: tags
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          PRERELEASE: ${{ needs.resolve-tag.outputs.prerelease }}
          HUB_REPOSITORY: bbmike253/bilisum
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${HUB_REPOSITORY}:${TAG}"
            echo "${HUB_REPOSITORY}:${VERSION}"
            if [ "${PRERELEASE}" != "true" ]; then
              # 稳定版更新 latest；预发布不覆盖稳定版镜像。
              echo "${HUB_REPOSITORY}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=gha,scope=bilisum-docker
          cache-to: type=gha,mode=min,scope=bilisum-docker
          tags: ${{ steps.tags.outputs.tags }}
